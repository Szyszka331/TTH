<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#100b07" />
  <meta name="description" content="Time4Heroes — mobilna gra RPG GPS" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Time4Heroes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Time4Heroes — Build 3.1.1 Clean</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles-3111.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (async function(){
    const key='t4h-clean-3111';
    if (!sessionStorage.getItem(key)) {
      sessionStorage.setItem(key,'1');
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch(e) { console.warn('Cache cleanup:', e); }
      location.reload();
      return;
    }
    const s=document.createElement('script');
    s.type='module';
    s.src='./app-3111.js';
    document.body.appendChild(s);
  })();
  </script>
</body>
</html>
